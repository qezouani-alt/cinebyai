name: newmovie
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.3

  # HTTP & API
  http: ^1.2.2

  # Image Handling
  cached_network_image: ^4.0.0

  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^4.0.0

  # URL Launching
  url_launcher: ^6.3.1

  # Icons
  cupertino_icons: ^1.0.8

  # Utilities
  uuid: ^4.5.2
  shared_preferences: ^2.3.4

  # Notifications
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.0.1

  # WebView
  flutter_inappwebview: ^6.1.5

  # Ads
  google_mobile_ads: ^9.1.0
  app_tracking_transparency: ^2.0.7

  # Localization
  flutter_localizations:
    sdk: flutter

  # Sharing
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  config:
    enable-swift-package-manager: false

  assets:
    - assets/images/appicon.png
    - assets/fonts/OFL.txt

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf

flutter_launcher_icons:
  android: false
  ios: true
  image_path: assets/images/appicon.png
  remove_alpha_ios: true
